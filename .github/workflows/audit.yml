name: Audit (Lighthouse + acessibilidade)

# Auditoria não bloqueia o deploy: roda semanalmente e sob demanda para
# acompanhar performance, acessibilidade, boas práticas e SEO do site publicado.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # toda segunda-feira, 06:00 UTC

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true